<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Redirecting...</title>
    <meta http-equiv="refresh" content="2; url=/">
    <script>
        (function () {
            var redirectPath = window.location.pathname + window.location.search + window.location.hash;
            try {
                sessionStorage.setItem('nanowiss.redirect', redirectPath);
                window.location.replace('/');
            } catch (error) {
                window.location.replace('/?redirect=' + encodeURIComponent(redirectPath));
            }
        })();
    </script>
</head>
<body>
    <p>Redirecting to nanoWISS...</p>
    <p><a href="/">Open nanoWISS</a></p>
</body>
</html>
